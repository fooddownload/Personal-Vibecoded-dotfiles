#COOL FUZZEL But vibecoded :(


[main]
font=Roboto :size=14
dpi-aware=yes
prompt="🐶 "
placeholder="fetch apps"
icons-enabled=yes
icon-theme=kora
lines=8
width=44
horizontal-pad=16
vertical-pad=12
inner-pad=8
image-size-ratio=0.55
line-height=28
letter-spacing=0
match-mode=fzf
filter-desktop=yes
terminal=ghostty -e
launch-prefix=

[colors]
# Deep midnight background matching Waybar islands (#0f172a with ~92% opacity)
background=0f172aeb
text=e2e8f0ff
prompt=38bdf8ff
placeholder=64748bff
input=f8fafcff
match=38bdf8ff
selection=1e293bff
selection-text=f8fafcff
selection-match=818cf8ff
counter=94a3b8ff
border=38bdf880

[border]
width=1
radius=12

[dmenu]
exit-immediately-if-empty=no
